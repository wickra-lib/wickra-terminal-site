name: Indicator counts

# The site restates two numbers it does not own: how many of the Wickra
# indicators the terminal reaches, and how many the library ships. Nothing
# checked either, and both drifted -- the terminal's sat at 460 while that
# repository said 457, stale twice over and noticed only by hand.
#
# The terminal guards its own copies with a marker and a test. This is the same
# check across a repository boundary, reading the marker rather than restating
# the number, so the terminal's README stays the one place it is decided.
#
# On a schedule as well as on push, because the number changes in the OTHER
# repository: a push here is not the event that makes this site wrong.
#
# Expect this to fail until wickra-terminal's second-audit branch merges. The
# site already carries the corrected 455; that repository's main still says 460,
# and the two disagreeing is exactly what this reports. It goes green on merge,
# with nothing to change here.
on:
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  counts:
    name: Counts match their source repositories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - run: node scripts/check-indicator-counts.mjs
